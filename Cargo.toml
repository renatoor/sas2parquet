[package]
name = "sas2parquet"
version = "0.1.0"
edition = "2024"
description = "Fast, zero-copy converter from SAS7BDAT files to Apache Parquet"
repository = "https://github.com/renatoor/sas2parquet"

[dependencies]
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.10", features = ["derive"] }
encoding_rs = "0.8.44"
memmap2 = "0.9.12"
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1.12.0"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
arrow-cast = { version = "60.2.0", features = ["prettyprint"] }
serde_json = "1.0.154"
